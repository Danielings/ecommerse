<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="/frontend/css/registro.css">
</head>
<body>

    <header>
        <h1>Tienda Online</h1>
    </header>

    <main class="registro">
        <section class="registro-tarjeta">
            <h2>Crear cuenta</h2>

            <form id="form-registro" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre-input" name="nombre" aria-describedby="error-nombre" autocomplete="name" required>
                    <span class="error" id="error-nombre"></span>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" aria-describedby="error-email" autocomplete="email" required>
                    <span class="error" id="error-email"></span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" aria-describedby="error-password" autocomplete="new-password" minlength="6" required>
                    <span class="error" id="error-password"></span>
                </div>

                <div class="campo">
                    <label for="confirmar_password">Confirmar contraseña</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" aria-describedby="error-confirmar_password" autocomplete="new-password" minlength="6" required>
                    <span class="error" id="error-confirmar_password"></span>
                </div>

                <p id="mensaje-registro" role="alert" hidden></p>

                <button type="submit" id="btn-registrarse">Registrarse</button>
            </form>

            <p class="registro-enlace">
                ¿Ya tienes cuenta? <a href="/frontend/login.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <script src="/frontend/js/registro.js"></script>

</body>
</html>
