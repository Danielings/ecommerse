<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar productos</title>
    <link rel="stylesheet" href="/frontend/css/admin.css">
    <link rel="stylesheet" href="/frontend/css/admin-productos.css">
</head>
<body>

    <header>
        <h1>Productos</h1>
        <div class="menu">
            <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false" aria-controls="menu-lista">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
            <div id="menu-lista" class="menu-lista" hidden>
                <a href="admin.html">Dashboard</a>
                <a href="admin-productos.html" aria-current="page">Productos</a>
                <button id="btn-cerrar-sesion">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="contenedor-admin">
        <section class="productos">
            <div class="encabezado-seccion">
                <h2>Listado de productos</h2>
                <button type="button" id="btn-agregar-producto" class="btn-agregar" aria-label="Agregar producto" title="Agregar producto">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div class="tabla-contenedor">
                <table class="tabla-productos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Imagen</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!--
                        Cada fila se genera con JavaScript, en este orden:
                        <tr>
                            <td>nombre</td>
                            <td>precio</td>
                            <td>categoría</td>
                            <td><img src="..." alt="..."></td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>
                    -->
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Formulario de edición -->
    <dialog id="dialogo-editar" class="dialogo" aria-labelledby="titulo-dialogo">
        <form id="form-editar" method="dialog">
            <h2 id="titulo-dialogo">Editar producto</h2>

            <label for="edit-nombre">Nombre</label>
            <input type="text" id="edit-nombre" name="nombre" required>

            <label for="edit-precio">Precio</label>
            <input type="number" id="edit-precio" name="precio" min="0" step="0.01" required>

            <label for="edit-categoria">Categoría</label>
            <select id="edit-categoria" name="categoria" required>
                <option value="ropa">Ropa</option>
                <option value="accesorios">Accesorios</option>
                <option value="calzado">Calzado</option>
            </select>

            <label for="edit-img">Imagen (URL o ruta)</label>
            <input type="text" id="edit-img" name="img" required>
            <img id="edit-img-preview" class="vista-previa" alt="Vista previa">

            <p id="edit-error" class="error" role="alert" hidden></p>

            <div class="dialogo-acciones">
                <button type="button" id="btn-cancelar-edicion" class="btn-secundario">Cancelar</button>
                <button type="submit" id="btn-guardar-edicion" class="btn-principal">Guardar cambios</button>
            </div>
        </form>
    </dialog>

    <script src="/frontend/js/menu.js"></script>
    <script src="/frontend/js/admin-productos.js"></script>
    
</body>
</html>
