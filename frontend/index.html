<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>

    <header>
        <h1>Tienda Online</h1>
        <div class="menu">
            <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false" aria-controls="menu-lista">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
            <div id="menu-lista" class="menu-lista" hidden>
                <a href="/frontend/perfil.html">Perfil</a>
                <a href="/frontend/billetera.html">Billetera</a>
                <button id="btn-cerrar-sesion">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="contenedor">
        <div id="estado-mensajes" class="mensajes-inline" role="status" aria-live="polite" aria-atomic="true"></div>
        
        <section class="productos">
            <h2>Productos</h2>
            <!-- Botones de filtro por categoría -->
            <nav class="filtros" aria-label="Filtrar productos por categoría">
                <button class="filtro activo" data-categoria="todos">Todos</button>
                <button class="filtro" data-categoria="ropa">Ropa</button>
                <button class="filtro" data-categoria="accesorios">Accesorios</button>
                <button class="filtro" data-categoria="calzado">Calzado</button>
            </nav>

            <div id="grid-productos">
                <!-- Productos se generan aquí -->
            </div>
        </section>

        <aside class="carrito" id="panel-carrito">
            <h2>Tu Carrito</h2>
            <div id="lista-carrito">
                <!-- Items del carrito se generan aquí -->
            </div>
            <div class="resumen">
                <p>Subtotal: $<span id="subtotal">0.00</span></p>
                <p>IVA (16%): $<span id="iva">0.00</span></p>
                <p class="total">Total: $<span id="total">0.00</span></p>
                <button id="btn-finalizar">Finalizar Compra</button>
            </div>
        </aside>
    </main>

    <script src="/frontend/js/menu.js"></script>
    <script src="/frontend/js/E-commerce.js"></script>
</body>
</html>
