<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard de Administrador</title>
    <link rel="stylesheet" href="/frontend/css/admin.css">

</head>
<body>

    <header>
        <h1>Dashboard de Administrador</h1>
        <div class="menu">
            <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false" aria-controls="menu-lista">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
            <div id="menu-lista" class="menu-lista" hidden>
                <a href="admin.html" aria-current="page">Dashboard</a>
                <a href="admin-productos.html">Productos</a>
                <button id="btn-cerrar-sesion">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="contenedor-admin">
        <section class="metricas" aria-label="Resumen de ventas">
            <article class="metrica">
                <p class="metrica-etiqueta">Ganancias totales</p>
                <h2 id="ganancias-totales">$0.00</h2>
            </article>

            <article class="metrica">
                <p class="metrica-etiqueta">Cantidad de ventas</p>
                <h2 id="cantidad-ventas">0</h2>
            </article>
        </section>

        <section class="ordenes">
            <div class="encabezado-seccion">
                <h2>Órdenes</h2>
                <button id="btn-descargar-pdf">Descargar Reporte PDF</button>
            </div>
            <div id="lista-ordenes">
                <!-- Las órdenes se generan aquí con JavaScript -->
            </div>
        </section>
    </main>

    <script src="/frontend/js/menu.js"></script>
    <script src="/frontend/js/admin.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.9/jspdf.plugin.autotable.min.js"></script>

</body>
</html>
